<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./main.css" />
        <title>Домашнє завдання №15</title>
    </head>
    <body>
        <header class="my-4">
            <div class="container mx-auto px-4">
                <h1 class="text-3xl font-bold text-center">Таблиця Мондріана (tailwindcss)</h1>
            </div>
        </header>
        <main class="my-4">
            <div class="container mx-auto px-4">
                <div class="flex justify-center">
                    <div class="grid grid-cols-[repeat(16,50px)] grid-rows-[repeat(16,50px)] cell-style">
                        <div class="row-span-2 col-span-4 cell-style bg-white"></div>
                        <div class="row-span-2 col-span-6 cell-style bg-white"></div>
                        <div class="row-span-2 col-span-5 cell-style bg-yellow-500"></div>                 
                        <div class="row-span-12 cell-style bg-white"></div>

                        <div class="row-span-4 col-span-2 cell-style bg-white"></div>
                        <div class="row-span-8 col-span-8 cell-style bg-red-500"></div>
                        <div class="row-span-4 col-span-5 cell-style bg-yellow-500"></div>

                        <div class="row-span-6 col-span-2 cell-style bg-white"></div>
                        <div class="row-span-4 col-span-5 grid grid-cols-2">
                            <div class="row-span-4 cell-style bg-white"></div>
                            <div class="row-span-4 cell-style bg-white"></div>
                        </div>
                        
                        <div class="row-span-4 col-span-4 cell-style bg-black"></div>
                        <div class="row-span-2 col-span-4 cell-style bg-white"></div>
                        <div class="row-span-2 col-span-5 cell-style bg-white"></div>
                        
                        <div class="row-span-4 col-span-2 cell-style bg-yellow-500"></div>
                        <div class="row-span-2 col-span-4 cell-style bg-white"></div>
                        <div class="row-span-3 col-span-5 cell-style bg-blue-500"></div>
                        <div class="row-span-4 cell-style bg-red-500"></div>
            
                        <div class="row-span-2 col-span-4 cell-style bg-white"></div>
                        <div class="col-span-4 cell-style bg-black"></div>

                        <div class="col-span-9 cell-style bg-white"></div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
